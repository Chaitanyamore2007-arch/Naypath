name: Keep GitHub Active

on:
  schedule:
    # Runs every day at 10:00 AM UTC
    - cron: '0 10 * * *'
  workflow_dispatch: # Allows you to run it manually from the UI

jobs:
  keep-active:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Activity Log
        run: |
          echo "Activity logged at $(date -u)" >> .github_activity.log
          
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github_activity.log
          git commit -m "chore: automated daily activity log to maintain project heartbeat" || echo "No changes to commit"
          git push
